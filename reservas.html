<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomControl - Reservas</title>

    <!-- Bootstrap CSS (Usa la misma versión que tengas en tu index) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tus estilos SASS compilados -->
    <link rel="stylesheet" href="sass/style.css">

    <!-- El truco del emoji para el logo de la pestaña -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
</head>

<body class="bg-light">

    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0">📅 Reservar Equipamiento</h4>
            </div>
            <div class="card-body p-4">

                <form id="form-reservas">
                    <!-- 1. Selección de Docente -->


                    <div class="form-group">
                    <label for="docente">Seleccionar Docente:</label>

                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="docente" list="lista-docentes"
                            placeholder="🔍 Tipeá nombre, apellido o DNI..." required autocomplete="off"
                            style="padding: 10px; flex-grow: 1; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">

                        <button type="button" id="btn-limpiar-busqueda"
                            style="background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;">
                            Limpiar
                        </button>
                    </div>

                    <datalist id="lista-docentes">
                    </datalist>
                </div>

                    <!-- 2. Selección de Fecha -->
                    <div class="mb-4">
                        <label for="input-fecha" class="form-label">Fecha de la Reserva:</label>
                        <input type="date" id="input-fecha" class="form-control" required>
                    </div>

                    <!-- 3. Selección de Fecha -->
                    <div class="form-group" style="margin-top: 20px; margin-bottom: 20px;">
                        <label style="font-weight: bold; color: #334155; margin-bottom: 10px; display: block;">
                            🕒 Seleccione las Horas Cátedra:
                        </label>

                        <div class="grilla-horas" id="contenedor-horas">
                            <label class="hora-item"><input type="checkbox" name="hora" value="1"> 1° (8:00 a
                                8:40)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="2"> 2° (8:40 a
                                9:20)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="3"> 3° (9:30 a
                                10:10)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="4"> 4° (10:10 a
                                10:50)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="5"> 5° (10:50 a
                                11:30)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="6"> 6° (11:40 a
                                12:20)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="7"> 7° (12:20 a
                                13:00)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="8"> 8° (13:30 a
                                14:10)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="9"> 9° (14:10 a
                                14:50)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="10"> 10° (14:50 a
                                15:30)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="11"> 11° (15:40 a
                                16:20)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="12"> 12° (16:20 a
                                17:00)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="13"> 13° (17:10 a
                                17:50)</label>
                            <label class="hora-item"><input type="checkbox" name="hora" value="14"> 14° (17:50 a
                                18:30)</label>
                        </div>
                    </div>


                    <!-- 4. Selección de Equipo -->
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Seleccionar Equipo / Aula:</label>
                        <button type="button" id="btn-abrir-modal" class="btn btn-primary w-100"
                            style="padding: 10px; font-weight: bold; background-color: #2563eb; border: none; color: white;">
                            Seleccionar Equipos Masivos
                        </button>
                    </div>



                    <!-- Botones de Acción -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Confirmar Reserva</button>
                        <a href="index.html" class="btn btn-outline-secondary">Volver al Inicio</a>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <div id="modal-equipos" class="modal oculto">
        <div class="modal-contenido"
            style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin: auto; position: relative;">

            <h3 style="margin-top: 0; color: #1e293b; text-align: center; font-size: 1.3em; margin-bottom: 5px;">
                Selección de Equipos / Aulas
            </h3>
            <p style="text-align: center; color: #64748b; font-size: 0.9em; margin-bottom: 20px;">
                Los equipos en <span style="color: #dc3545; font-weight: bold;">rojo</span> ya están reservados para la
                fecha elegida.
            </p>

            <div id="contenedor-equipos"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; max-height: 300px; overflow-y: auto; padding: 5px;">
            </div>

            <div style="margin-top: 25px; display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" onclick="cerrarModal()"
                    style="background-color: #64748b; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    Cancelar
                </button>
                <button type="button" id="btn-confirmar-seleccion-modal"
                    style="background-color: #10b981; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    Confirmar Selección
                </button>
            </div>

        </div>
    </div>

   <div id="sidebar-historial" class="sidebar-flotante" tabindex="0">
    <div class="sidebar-pestana">
        📅 <span>Historial Reservas</span>
    </div>
    <div class="sidebar-contenido">
        <h2>Historial del Mes</h2>
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th style="text-align: left; padding: 10px;">Docente</th>
                        <th style="text-align: left; padding: 10px;">Equipo</th>
                        <th style="text-align: center; padding: 10px;">Fecha</th>
                    </tr>
                </thead>
                <tbody id="tabla-historial-body">
                    </tbody>
            </table>
        </div>
    </div>
</div>

    <!-- 📚 LIBRERÍAS -->
    <!-- Supabase CDN (Asegurate de que sea la misma versión que usás en app.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <!-- 🧠 LÓGICA MODULARIZADA -->
    <!-- Creamos un archivo JS exclusivo para esta pantalla -->
    <script type="module" src="src/reservas.js"></script>
    
</body>

</html>
